<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(role, activePage)" class="sidebar">
    <div class="brand">
        <div class="brand-logo">T</div>
        <div class="brand-text">
            <h1>TeacherMatch</h1>
            <p>RECRUITMENT PORTAL</p>
        </div>
    </div>

    <div class="sidebar-section-title">WORKSPACE</div>

    <nav class="sidebar-nav" aria-label="Partner navigation" th:if="${role == 'partner'}">
        <a th:href="@{/partner#dashboard}" class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? ' active' : ''" data-section="dashboard"><span class="sidebar-icon" aria-hidden="true">▦</span><span>Dashboard</span></a>
        <a th:href="@{/partner#profiles}" class="sidebar-link" th:classappend="${activePage == 'profiles'} ? ' active' : ''" data-section="profiles"><span class="sidebar-icon" aria-hidden="true">♧</span><span>Shared profiles</span></a>
        <a th:href="@{/partner#interviews}" class="sidebar-link" th:classappend="${activePage == 'interviews'} ? ' active' : ''" data-section="interviews"><span class="sidebar-icon" aria-hidden="true">◷</span><span>Interviews &amp; Results</span></a>
    </nav>

    <nav class="sidebar-nav" aria-label="Matching Staff navigation" th:if="${role == 'staff'}">
        <a th:href="@{/staff#dashboard}" class="sidebar-link" th:classappend="${activePage == 'dashboard'} ? ' active' : ''" data-section="dashboard"><span class="sidebar-icon" aria-hidden="true">▦</span><span>Dashboard</span></a>
        <a th:href="@{/staff#profiles}" class="sidebar-link" th:classappend="${activePage == 'profiles'} ? ' active' : ''" data-section="profiles"><span class="sidebar-icon" aria-hidden="true">♧</span><span>Teacher pool</span></a>
        <a th:href="@{/staff#interviews}" class="sidebar-link" th:classappend="${activePage == 'interviews'} ? ' active' : ''" data-section="interviews"><span class="sidebar-icon" aria-hidden="true">◷</span><span>Interviews &amp; feedback</span></a>
    </nav>

    <nav class="sidebar-nav" aria-label="Teacher navigation" th:if="${role == 'teacher'}">
        <a th:href="@{/teacher#profile}" class="sidebar-link" th:classappend="${activePage == 'profile'} ? ' active' : ''" data-section="profile"><span class="sidebar-icon" aria-hidden="true">▦</span><span>My profile</span></a>
        <a th:href="@{/teacher#documents}" class="sidebar-link" th:classappend="${activePage == 'documents'} ? ' active' : ''" data-section="documents"><span class="sidebar-icon" aria-hidden="true">▤</span><span>Documents</span></a>
        <a th:href="@{/teacher#interviews}" class="sidebar-link" th:classappend="${activePage == 'interviews'} ? ' active' : ''" data-section="interviews"><span class="sidebar-icon" aria-hidden="true">◷</span><span>Interviews</span></a>
    </nav>

    <div class="sidebar-bottom">
        <div class="help-card">
            <h3>Need a hand?</h3>
            <p>Keep every hiring step moving.</p>
        </div>
        <a class="signout-link" th:href="@{/logout}"><span aria-hidden="true">↪</span> Sign out</a>
    </div>

    <script>
        (function () {
            const links = Array.from(document.querySelectorAll('.sidebar-nav .sidebar-link'));
            function getCurrentSection() {
                const hash = window.location.hash.replace('#', '');
                return links.some(link => link.dataset.section === hash)
                    ? hash
                    : (links[0] ? links[0].dataset.section : '');
            }
            function updateActiveLink(section) {
                links.forEach(function (link) {
                    const isActive = link.dataset.section === section;
                    link.classList.toggle('active', isActive);
                    if (isActive) link.setAttribute('aria-current', 'page');
                    else link.removeAttribute('aria-current');
                });
            }
            document.addEventListener('click', function (event) {
                const link = event.target.closest('.sidebar-nav .sidebar-link');
                if (link) updateActiveLink(link.dataset.section);
            });
            window.addEventListener('hashchange', function () {
                updateActiveLink(getCurrentSection());
            });
            updateActiveLink(getCurrentSection());
        })();
    </script>
</aside>
</body>
</html>
